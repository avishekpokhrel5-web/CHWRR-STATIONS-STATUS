<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RLS Station Daily Status Register — CHWRR 2026</title>
<style>
  :root {
    --bg-main: #0f172a;
    --card-bg: #1e293b;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --border: #334155;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-primary); padding: 20px; line-height: 1.5; }
  .container { max-width: 1400px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  h1 { font-size: 1.5rem; color: #38bdf8; }
  .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
  .btn:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #dc2626; }
  .btn-secondary { background: #475569; }
  .btn-secondary:hover { background: #334155; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 0.85rem; color: var(--text-muted); }
  input, select { background: #0f172a; border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 6px; }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 0.9rem; }
  th { background: #0f172a; color: #38bdf8; }
  tr:nth-child(even) { background: #162032; }
  .flash-msg { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; background: var(--success); color: white; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: none; z-index: 100; }
  .flash-error { background: var(--danger); }
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-content { background: var(--card-bg); padding: 25px; border-radius: 8px; width: 100%; max-width: 500px; border: 1px solid var(--border); }
  .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .nav-tab { padding: 8px 16px; background: #0f172a; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; cursor: pointer; }
  .nav-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>RLS Station Daily Status Register</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Center of Hydrology and Water Resources Research — 2026</p>
    </div>
    <div id="auth-controls"></div>
  </header>

  <div class="nav-tabs" id="tab-controls"></div>

  <div id="main-content"></div>
</div>

<div id="flash-banner" class="flash-msg"></div>
<div id="modal-container"></div>

<script>
/* ── LOCAL STORAGE HELPERS ── */
function lGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function lDel(k){ try { localStorage.removeItem(k); } catch(e){} }

/* ── CONSTANTS & AUTH ── */
var CUR_YEAR = 2026;
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var SUBTYPES = ["Hydrological Stations", "Meteorological Stations"];
var DEF_HYDRO = [
  { no: "240", name: "Karnali at Asaraghat", elev: "540m", type: "Manual+Automatic", med: "GSM" },
  { no: "250", name: "West Seti at Slaugad", elev: "820m", type: "Manual+Automatic", med: "GSM" }
];

var AUTH = {
  user: lGet("rls_auth_user") || { username: "admin", role: "admin", offices: ["CHWRR", "OHM Dharan"] }
};

function hashPwd(p){ return btoa(encodeURIComponent(p + "_rlschwrr_2026")); }

function SK(office, subtype) { return "stns_" + office + "_" + subtype; }
function TK(office, subtype, month) { return "status_" + office + "_" + subtype + "_" + month; }

/* ── STATE ── */
var S = {
  offices: lGet("rls_offices") || ["CHWRR", "OHM Dharan"],
  office: "CHWRR",
  subtype: "Hydrological Stations",
  month: MONTHS[new Date().getMonth()],
  year: lGet("rls_year") || CUR_YEAR,
  stns: {},
  status: {},
  showManage: false,
  showAddOff: false,
  showDelOff: false,
  showUserMgmt: false,
  view: "status",
  invSide: "sat",
  invAddFor: null,
  invHistFor: null,
  invMatchOnly: false,
  invForm: {},
  newOff: "",
  newNo: "",
  newName: "",
  newElev: "",
  newType: "Manual+Automatic",
  newMed: "GSM",
  newUsr: { username: "", password: "", role: "dataentry", offices: {}, subtypes: {} }
};

function initStns(){
  var allOff = lGet("rls_offices") || S.offices;
  S.offices = allOff;
  allOff.forEach(function(o){
    SUBTYPES.forEach(function(s){
      var k = SK(o,s);
      if(S.stns[k] === undefined){
        var saved = lGet(k);
        S.stns[k] = saved ? saved : (o === "CHWRR" && s === "Hydrological Stations" ? JSON.parse(JSON.stringify(DEF_HYDRO)) : []);
      }
    });
  });
}

function getVisibleOffices(){
  var all = lGet("rls_offices") || ["CHWRR"];
  if(!AUTH.user || AUTH.user.role === "admin") return all;
  return all.filter(function(o){ return AUTH.user.offices.indexOf(o) >= 0; });
}

function flash(msg, isErr){
  var el = document.getElementById("flash-banner");
  el.textContent = msg;
  el.className = "flash-msg" + (isErr ? " flash-error" : "");
  el.style.display = "block";
  setTimeout(function(){ el.style.display = "none"; }, 3000);
}

function deleteOffice(name){
  if(!AUTH.user || AUTH.user.role !== "admin"){ flash("Only Admin can delete offices.", true); return; }
  if(name === "CHWRR"){ flash("Cannot delete the default CHWRR office", true); return; }
  if(!confirm('Delete office "' + name + '"?\nAll its stations and status data will be removed.')) return;
  SUBTYPES.forEach(function(s){
    lDel(SK(name,s)); delete S.stns[SK(name,s)];
    MONTHS.forEach(function(m){ lDel(TK(name,s,m)); });
  });
  var allOff = (lGet("rls_offices") || S.offices).filter(function(o){ return o !== name; });
  lSet("rls_offices", allOff); S.offices = allOff;
  if(S.office === name) S.office = allOff[0];
  S.showDelOff = false; flash('Office "' + name + '" deleted'); render();
}

function addStation(){
  if(!S.newNo || !S.newName) { flash("Station Number and Name are required.", true); return; }
  var k = SK(S.office, S.subtype);
  var list = S.stns[k] || [];
  list.push({
    no: S.newNo,
    name: S.newName,
    elev: S.newElev,
    type: S.newType,
    med: S.newMed
  });
  S.stns[k] = list;
  lSet(k, list);
  S.newNo = ""; S.newName = ""; S.newElev = "";
  flash("Station added successfully");
  render();
}

function render(){
  initStns();
  var visibleOffices = getVisibleOffices();
  if(visibleOffices.indexOf(S.office) === -1 && visibleOffices.length > 0){
    S.office = visibleOffices[0];
  }

  // Render Auth Header
  var authEl = document.getElementById("auth-controls");
  authEl.innerHTML = '<span>User: <strong>' + (AUTH.user ? AUTH.user.username : "Guest") + '</strong> (' + (AUTH.user ? AUTH.user.role : "None") + ')</span>';

  // Render Nav Tabs
  var tabEl = document.getElementById("tab-controls");
  tabEl.innerHTML = `
    <button class="nav-tab ${S.view === 'status' ? 'active' : ''}" onclick="S.view='status';render();">Status Register</button>
    <button class="nav-tab ${S.view === 'manage' ? 'active' : ''}" onclick="S.view='manage';render();">Manage Stations</button>
  `;

  // Main Render
  var mainEl = document.getElementById("main-content");
  if(S.view === 'manage') {
    var k = SK(S.office, S.subtype);
    var list = S.stns[k] || [];
    var rows = list.map(function(st, idx){
      return `<tr>
        <td>${st.no}</td>
        <td>${st.name}</td>
        <td>${st.elev}</td>
        <td>${st.type}</td>
        <td>${st.med}</td>
      </tr>`;
    }).join("");

    mainEl.innerHTML = `
      <div class="card">
        <h3>Manage Stations - ${S.office} (${S.subtype})</h3>
        <div style="margin: 15px 0;">
          <label>Office Selection: </label>
          <select onchange="S.office=this.value;render();">
            ${visibleOffices.map(function(o){ return `<option value="${o}" ${o===S.office?'selected':''}>${o}</option>`; }).join("")}
          </select>
          <select onchange="S.subtype=this.value;render();" style="margin-left: 10px;">
            ${SUBTYPES.map(function(s){ return `<option value="${s}" ${s===S.subtype?'selected':''}>${s}</option>`; }).join("")}
          </select>
        </div>
        
        <h4 style="margin-top:20px;">Add New Station</h4>
        <div class="grid-form" style="margin-top:10px;">
          <div class="form-group"><label>Stn No</label><input type="text" value="${S.newNo}" oninput="S.newNo=this.value"></div>
          <div class="form-group"><label>Stn Name</label><input type="text" value="${S.newName}" oninput="S.newName=this.value"></div>
          <div class="form-group"><label>Elevation</label><input type="text" value="${S.newElev}" oninput="S.newElev=this.value"></div>
          <div class="form-group">
            <label>Type</label>
            <select onchange="S.newType=this.value">
              <option value="Manual+Automatic">Manual+Automatic</option>
              <option value="Automatic">Automatic</option>
              <option value="Manual">Manual</option>
            </select>
          </div>
          <div class="form-group">
            <label>Medium</label>
            <select onchange="S.newMed=this.value">
              <option value="GSM">GSM</option>
              <option value="Satellite">Satellite</option>
            </select>
          </div>
        </div>
        <button class="btn" onclick="addStation()">Add Station</button>

        <table style="margin-top:25px;">
          <thead>
            <tr><th>No</th><th>Name</th><th>Elevation</th><th>Type</th><th>Medium</th></tr>
          </thead>
          <tbody>
            ${rows || '<tr><td colspan="5">No stations configured for this category.</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  } else {
    mainEl.innerHTML = `
      <div class="card">
        <div style="display:flex; gap: 15px; align-items:center;">
          <div>
            <label>Office: </label>
            <select onchange="S.office=this.value;render();">
              ${visibleOffices.map(function(o){ return `<option value="${o}" ${o===S.office?'selected':''}>${o}</option>`; }).join("")}
            </select>
          </div>
          <div>
            <label>Type: </label>
            <select onchange="S.subtype=this.value;render();">
              ${SUBTYPES.map(function(s){ return `<option value="${s}" ${s===S.subtype?'selected':''}>${s}</option>`; }).join("")}
            </select>
          </div>
          <div>
            <label>Month: </label>
            <select onchange="S.month=this.value;render();">
              ${MONTHS.map(function(m){ return `<option value="${m}" ${m===S.month?'selected':''}>${m}</option>`; }).join("")}
            </select>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>Daily Status Dashboard</h3>
        <p style="color: var(--text-muted); font-size:0.9rem; margin-top:5px;">
          Showing active record sheet for <strong>${S.office}</strong> - ${S.subtype} (${S.month} ${S.year})
        </p>
      </div>
    `;
  }
}

// Initial Kickoff
render();
</script>
</body>
</html>
